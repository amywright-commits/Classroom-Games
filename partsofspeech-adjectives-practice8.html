<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystery Bag</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1a237e; /* Deep dark blue for mystery */
            --card-bg: #283593;
            --primary: #ffeb3b; /* Bright yellow */
            --secondary: #ff4081; /* Pink */
            --text-main: #ffffff;
            --box-color: #8d6e63;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Animated background particles */
        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50px 160px, #ddd, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 130px 80px, #fff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            opacity: 0.3;
        }

        .container {
            background: linear-gradient(145deg, var(--card-bg), #1a237e);
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 0 4px rgba(255, 255, 255, 0.1);
            max-width: 800px;
            width: 100%;
            padding: 40px;
            position: relative;
            z-index: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            color: var(--primary);
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 4px 0px #c2185b;
            letter-spacing: 2px;
        }

        .instructions {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #bbdefb;
        }

        /* Stats Bar */
        .stats {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            background: rgba(0,0,0,0.2);
            padding: 10px 20px;
            border-radius: 15px;
        }

        /* Mystery Box Area */
        .game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            min-height: 400px;
            position: relative;
        }

        .box-container {
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
            margin-top: 20px;
        }

        .box-container:hover {
            transform: scale(1.05);
        }

        .mystery-box {
            font-size: 120px;
            user-select: none;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5));
            transition: all 0.3s;
        }

        .shake {
            animation: shake-animation 0.5s ease-in-out;
        }

        @keyframes shake-animation {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-5deg); }
            20% { transform: translate(-3px, 0px) rotate(5deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(5deg); }
            50% { transform: translate(-1px, 2px) rotate(-5deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-5deg); }
            80% { transform: translate(-1px, -1px) rotate(5deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-5deg); }
        }

        .box-hint {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--secondary);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1rem;
            white-space: nowrap;
            pointer-events: none;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateX(-50%) translateY(0);}
            40% {transform: translateX(-50%) translateY(-10px);}
            60% {transform: translateX(-50%) translateY(-5px);}
        }

        /* Clues Area */
        .clues-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
            min-height: 60px;
        }

        .clue-badge {
            background-color: white;
            color: var(--card-bg);
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 1.3rem;
            font-weight: 900;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            opacity: 0;
            transform: translateY(20px);
            animation: popIn 0.4s forwards;
            border: 3px solid var(--primary);
        }

        @keyframes popIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Guessing Options Area */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 600px;
            margin-top: 20px;
            display: none; /* Hidden until clues are revealed */
        }

        .option-btn {
            background-color: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
            padding: 15px;
            font-size: 1.3rem;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover {
            background-color: rgba(255,255,255,0.2);
            border-color: var(--primary);
            transform: translateY(-3px);
        }

        .option-btn.correct {
            background-color: #4caf50;
            border-color: #2e7d32;
        }

        .option-btn.incorrect {
            background-color: #f44336;
            border-color: #b71c1c;
        }

        /* Result Overlay */
        .result-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(26, 35, 126, 0.95);
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .result-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .result-emoji {
            font-size: 100px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }

        .result-title {
            font-family: 'Fredoka One', cursive;
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .next-btn {
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-family: 'Fredoka One', cursive;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 30px;
            box-shadow: 0 6px 0 #c2185b;
            transition: all 0.1s ease;
        }

        .next-btn:active {
            transform: translateY(6px);
            box-shadow: none;
        }

        .next-btn:hover {
            background-color: #ff80ab;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .container { padding: 20px; }
            .options-grid { grid-template-columns: 1fr; }
            .mystery-box { font-size: 100px; }
            .clue-badge { font-size: 1.1rem; padding: 8px 16px; }
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="container">
        
        <div id="startScreen" style="width: 100%;">
            <h1>Mystery Bag</h1>
            <p class="instructions">Click on the mystery box to "feel" what's inside. Pay close attention to the descriptive adjectives, then guess the hidden object!</p>
            <div style="font-size: 100px; margin: 20px 0;">🎒</div>
            <button class="next-btn" onclick="startGame()">Play Now!</button>
        </div>

        <div id="gameScreen" style="display: none; width: 100%;">
            <div class="stats">
                <div>Item: <span id="currentLevel">1</span>/<span id="totalLevels">8</span></div>
                <div>Score: <span id="scoreDisplay">0</span></div>
            </div>

            <div class="game-area">
                <!-- Interactive Box -->
                <div class="box-container" id="boxContainer" onclick="feelBox()">
                    <div class="mystery-box" id="mysteryBox">📦</div>
                    <div class="box-hint" id="boxHint">Click to feel!</div>
                </div>

                <!-- Adjective Clues -->
                <div class="clues-container" id="cluesContainer">
                    <!-- Clues appear here -->
                </div>

                <!-- Multiple Choice Options -->
                <div class="options-grid" id="optionsGrid">
                    <!-- Options injected here -->
                </div>
            </div>
        </div>

        <!-- Result / Feedback Overlay -->
        <div class="result-overlay" id="resultOverlay">
            <div class="result-emoji" id="resultEmoji">🏆</div>
            <h2 class="result-title" id="resultTitle">Correct!</h2>
            <p class="instructions" id="resultDesc">It was a Pinecone!</p>
            <button class="next-btn" id="overlayBtn" onclick="nextItem()">Next Item ➜</button>
        </div>

    </div>

    <script>
        // Database of mystery items with their specific adjectives and distractors
        const mysteryItems = [
            {
                name: "Pinecone",
                emoji: "🌲",
                clues: ["prickly", "rigid", "rough", "oval"],
                options: ["Pinecone", "Hairbrush", "Cactus", "Football"]
            },
            {
                name: "Ice Cube",
                emoji: "🧊",
                clues: ["freezing", "smooth", "slippery", "cubic"],
                options: ["Glass Paperweight", "Diamond", "Ice Cube", "Soap"]
            },
            {
                name: "Feather",
                emoji: "🪶",
                clues: ["weightless", "soft", "ticklish", "delicate"],
                options: ["Cotton Ball", "Tissue", "Feather", "Silk Scarf"]
            },
            {
                name: "Tennis Ball",
                emoji: "🎾",
                clues: ["fuzzy", "spherical", "bouncy", "firm"],
                options: ["Peach", "Tennis Ball", "Orange", "Yarn"]
            },
            {
                name: "Coin",
                emoji: "🪙",
                clues: ["hard", "metallic", "circular", "flat"],
                options: ["Plate", "Button", "Cookie", "Coin"]
            },
            {
                name: "Sponge",
                emoji: "🧽",
                clues: ["porous", "squishy", "absorbent", "rectangular"],
                options: ["Bread", "Sponge", "Marshmallow", "Brick"]
            },
            {
                name: "Sandpaper",
                emoji: "📜",
                clues: ["scratchy", "coarse", "flat", "abrasive"],
                options: ["Sandpaper", "Cardboard", "Carpet", "Toast"]
            },
            {
                name: "Slime",
                emoji: "🦠",
                clues: ["gooey", "stretchy", "slimy", "cold"],
                options: ["Jelly", "Mud", "Slime", "Gum"]
            },
            {
                name: "Marble",
                emoji: "🔮",
                clues: ["smooth", "hard", "spherical", "cold"],
                options: ["Grape", "Marble", "Eyeball", "Dice"]
            },
            {
                name: "Marshmallow",
                emoji: "🍡",
                clues: ["squishy", "powdery", "cylindrical", "light"],
                options: ["Cotton Ball", "Eraser", "Marshmallow", "Chalk"]
            },
            {
                name: "Key",
                emoji: "🔑",
                clues: ["metallic", "jagged", "flat", "rigid"],
                options: ["Coin", "Key", "Paperclip", "Nail"]
            },
            {
                name: "Rubber Band",
                emoji: "➰",
                clues: ["stretchy", "thin", "flexible", "rubbery"],
                options: ["String", "Wire", "Spaghetti", "Rubber Band"]
            },
            {
                name: "Seashell",
                emoji: "🐚",
                clues: ["ridged", "hard", "hollow", "brittle"],
                options: ["Rock", "Seashell", "Teacup", "Bone"]
            }
        ];

        let currentItemIndex = 0;
        let currentClueIndex = 0;
        let score = 0;
        let itemRevealed = false;

        // DOM Elements
        const startScreen = document.getElementById('startScreen');
        const gameScreen = document.getElementById('gameScreen');
        const boxContainer = document.getElementById('boxContainer');
        const mysteryBox = document.getElementById('mysteryBox');
        const boxHint = document.getElementById('boxHint');
        const cluesContainer = document.getElementById('cluesContainer');
        const optionsGrid = document.getElementById('optionsGrid');
        
        const currentLevelDisplay = document.getElementById('currentLevel');
        const totalLevelsDisplay = document.getElementById('totalLevels');
        const scoreDisplay = document.getElementById('scoreDisplay');
        
        const resultOverlay = document.getElementById('resultOverlay');
        const resultEmoji = document.getElementById('resultEmoji');
        const resultTitle = document.getElementById('resultTitle');
        const resultDesc = document.getElementById('resultDesc');
        const overlayBtn = document.getElementById('overlayBtn');

        function startGame() {
            startScreen.style.display = 'none';
            gameScreen.style.display = 'block';
            currentItemIndex = 0;
            score = 0;
            loadItem();
        }

        function loadItem() {
            // Reset state for new item
            currentClueIndex = 0;
            itemRevealed = false;
            cluesContainer.innerHTML = '';
            optionsGrid.innerHTML = '';
            optionsGrid.style.display = 'none';
            mysteryBox.innerText = "📦"; // Reset to closed box
            boxContainer.style.pointerEvents = 'all';
            boxHint.innerText = "Click to feel!";
            boxHint.style.display = 'block';
            
            currentLevelDisplay.innerText = currentItemIndex + 1;
            totalLevelsDisplay.innerText = mysteryItems.length;
            scoreDisplay.innerText = score;
        }

        function feelBox() {
            if (itemRevealed) return; // Prevent clicks if guessing phase started

            const item = mysteryItems[currentItemIndex];
            
            // Add shake animation
            mysteryBox.classList.remove('shake');
            void mysteryBox.offsetWidth; // Trigger reflow to restart animation
            mysteryBox.classList.add('shake');

            // Give a tactile/visual change for feeling inside
            setTimeout(() => {
                mysteryBox.innerText = "🖐️"; // Hand reaching in
                setTimeout(() => {
                    if(!itemRevealed) mysteryBox.innerText = "📦"; 
                }, 400);
            }, 100);

            // Show clue
            if (currentClueIndex < item.clues.length) {
                const clueBadge = document.createElement('div');
                clueBadge.className = 'clue-badge';
                clueBadge.innerText = item.clues[currentClueIndex];
                cluesContainer.appendChild(clueBadge);
                
                currentClueIndex++;
                boxHint.innerText = `Keep feeling! (${currentClueIndex}/${item.clues.length})`;

                // If all clues revealed, show guessing options
                if (currentClueIndex === item.clues.length) {
                    showOptions();
                }
            }
        }

        function showOptions() {
            itemRevealed = true;
            boxContainer.style.pointerEvents = 'none'; // Stop feeling the box
            boxHint.style.display = 'none';
            
            const item = mysteryItems[currentItemIndex];
            optionsGrid.style.display = 'grid';

            item.options.forEach(optionText => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = optionText;
                btn.onclick = () => checkGuess(btn, optionText, item.name);
                optionsGrid.appendChild(btn);
            });
        }

        function checkGuess(btnElement, guessedName, correctName) {
            // Disable all buttons
            const allBtns = optionsGrid.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.style.pointerEvents = 'none');

            const isCorrect = (guessedName === correctName);

            if (isCorrect) {
                btnElement.classList.add('correct');
                score++;
                scoreDisplay.innerText = score;
                showOverlay(true);
            } else {
                btnElement.classList.add('incorrect');
                // Highlight correct one
                allBtns.forEach(b => {
                    if(b.innerText === correctName) b.classList.add('correct');
                });
                showOverlay(false);
            }
        }

        function showOverlay(isCorrect) {
            const item = mysteryItems[currentItemIndex];
            
            // Wait a moment for them to see the button turn green/red
            setTimeout(() => {
                mysteryBox.innerText = item.emoji; // Reveal item in box behind overlay!
                
                resultOverlay.classList.add('active');
                resultEmoji.innerText = item.emoji;
                
                if (isCorrect) {
                    resultTitle.innerText = "Spot On!";
                    resultTitle.style.color = "#4caf50";
                    resultDesc.innerText = `You correctly identified the ${item.name}!`;
                } else {
                    resultTitle.innerText = "Not Quite!";
                    resultTitle.style.color = "#f44336";
                    resultDesc.innerText = `The mystery item was actually a ${item.name}.`;
                }

                // Check if game over
                if (currentItemIndex === mysteryItems.length - 1) {
                    overlayBtn.innerText = "See Final Score 🏆";
                } else {
                    overlayBtn.innerText = "Next Item ➜";
                }
            }, 800);
        }

        function nextItem() {
            resultOverlay.classList.remove('active');
            
            if (currentItemIndex === mysteryItems.length - 1) {
                // End Game
                gameScreen.style.display = 'none';
                startScreen.style.display = 'block';
                document.querySelector('#startScreen h1').innerText = "Game Over!";
                document.querySelector('#startScreen .instructions').innerText = `You correctly guessed ${score} out of ${mysteryItems.length} mystery items!`;
                document.querySelector('#startScreen .next-btn').innerText = "Play Again";
            } else {
                // Next Level
                currentItemIndex++;
                loadItem();
            }
        }
    </script>
</body>
</html>
