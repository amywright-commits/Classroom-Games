<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌶️ Spicy Etymology Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            background-color: #fff7ed; /* Light warm cream */
            background-image: radial-gradient(#fdba74 2px, transparent 2px);
            background-size: 30px 30px;
            color: #1f2937; /* Dark gray text */
        }
        
        .option-btn {
            transition: all 0.2s;
            border-bottom-width: 4px;
        }
        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            background-color: #ffedd5; /* orange-100 */
        }
        .option-btn:active:not(:disabled) {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }
        
        .correct-ans {
            background-color: #10b981 !important; /* emerald-500 */
            color: white !important;
            border-color: #047857 !important; /* emerald-700 */
        }
        
        .wrong-ans {
            background-color: #f43f5e !important; /* rose-500 */
            color: white !important;
            border-color: #be123c !important; /* rose-700 */
        }

        .disabled-opt {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        @keyframes pop {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: pop 0.3s ease-out forwards;
        }

        .streak-fire {
            display: inline-block;
            animation: burn 1s alternate infinite ease-in-out;
        }
        @keyframes burn {
            0% { transform: scale(1) translateY(0); opacity: 0.8; }
            100% { transform: scale(1.2) translateY(-2px); opacity: 1; }
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center">

    <!-- Header & Stats -->
    <header class="w-full max-w-3xl flex justify-between items-end mb-6">
        <div>
            <h1 class="text-3xl md:text-4xl font-extrabold text-orange-600 drop-shadow-sm">🌶️ Etymology Challenge</h1>
            <p class="text-gray-600 font-semibold mt-1">Analyze prefixes, roots, and suffixes!</p>
        </div>
        <div class="text-right">
            <div class="text-2xl font-bold text-orange-600 bg-white px-4 py-1 rounded-2xl shadow-sm border-2 border-orange-200">
                Score: <span id="score-display">0</span>
            </div>
            <div id="streak-container" class="text-sm font-bold text-red-500 mt-2 hidden transition-all">
                <span class="streak-fire">🔥</span> <span id="streak-count">3</span>x Streak!
            </div>
        </div>
    </header>

    <!-- Main Game Area -->
    <main class="w-full max-w-3xl bg-white rounded-3xl shadow-xl border-4 border-orange-300 p-6 md:p-8 relative z-10">
        
        <!-- Progress Bar -->
        <div class="w-full bg-gray-200 rounded-full h-3 mb-6 border border-gray-300">
            <div id="progress-bar" class="bg-orange-500 h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
        <div class="text-sm font-bold text-gray-500 mb-4 uppercase tracking-wider">
            Question <span id="q-current">1</span> of <span id="q-total">25</span>
        </div>

        <!-- Question Container -->
        <div id="question-container" class="animate-pop">
            <div class="flex justify-between items-start mb-2">
                <span id="q-badge" class="bg-red-100 text-red-700 text-xs font-bold px-3 py-1 rounded-full border border-red-200">
                    🌶️ Medium
                </span>
                <span id="q-sub" class="text-sm text-gray-500 font-semibold italic">Analyze Root</span>
            </div>
            
            <h2 id="question-text" class="text-2xl md:text-3xl font-bold text-gray-800 mb-8 leading-tight">
                Loading question...
            </h2>

            <!-- Options Grid -->
            <div id="options-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <!-- Buttons injected by JS -->
            </div>
        </div>

        <!-- Feedback Box (Hidden initially) -->
        <div id="feedback-box" class="hidden rounded-2xl p-5 mb-6 border-4 animate-pop shadow-sm">
            <h3 id="feedback-title" class="text-2xl font-bold mb-2 flex items-center gap-2">
                <!-- Correct/Incorrect -->
            </h3>
            <p id="feedback-text" class="text-lg font-semibold text-gray-800">
                <!-- Explanation -->
            </p>
        </div>

        <!-- Next Button -->
        <div class="text-right">
            <button id="next-btn" onclick="nextQuestion()" class="hidden bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-8 rounded-xl shadow-md border-b-4 border-orange-700 active:border-b-0 active:translate-y-1 transition-all text-xl">
                Next Question ➡️
            </button>
        </div>
    </main>

    <!-- Results Screen (Hidden initially) -->
    <div id="results-screen" class="hidden w-full max-w-3xl bg-white rounded-3xl shadow-xl border-4 border-orange-300 p-8 text-center animate-pop mt-10 z-20 relative">
        <div class="text-6xl mb-4" id="result-emoji">🏆</div>
        <h2 class="text-4xl font-extrabold text-orange-600 mb-2">Challenge Complete!</h2>
        
        <div class="bg-orange-50 rounded-2xl p-6 my-6 border-2 border-orange-200 inline-block w-full max-w-md">
            <p class="text-lg text-gray-600 font-semibold mb-2">Final Score</p>
            <p class="text-5xl font-bold text-gray-800 mb-4"><span id="final-score">0</span> / <span id="max-score">2500</span></p>
            
            <div class="flex justify-around border-t-2 border-orange-200 pt-4 mt-2">
                <div>
                    <p class="text-sm text-gray-500 font-bold uppercase">Accuracy</p>
                    <p class="text-2xl font-bold text-green-600" id="final-accuracy">0%</p>
                </div>
                <div>
                    <p class="text-sm text-gray-500 font-bold uppercase">Best Streak</p>
                    <p class="text-2xl font-bold text-red-500"><span id="final-streak">0</span> 🔥</p>
                </div>
            </div>
        </div>
        
        <p id="grade-message" class="text-2xl font-bold text-gray-700 mb-8">Amazing job analyzing roots!</p>

        <button onclick="restartGame()" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 px-10 rounded-full shadow-md border-b-4 border-orange-700 active:border-b-0 active:translate-y-1 transition-all text-xl w-full md:w-auto">
            Play Again 🔄
        </button>
    </div>

        // --- Game State ---
        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let currentStreak = 0;
        let maxStreak = 0;
        let correctAnswersCount = 0;

        // --- DOM Elements ---
        const qTotal = document.getElementById('q-total');
        const qCurrent = document.getElementById('q-current');
        const progressBar = document.getElementById('progress-bar');
        const scoreDisplay = document.getElementById('score-display');
        const streakContainer = document.getElementById('streak-container');
        const streakCount = document.getElementById('streak-count');
        const questionText = document.getElementById('question-text');
        const qBadge = document.getElementById('q-badge');
        const qSub = document.getElementById('q-sub');
        const optionsGrid = document.getElementById('options-grid');
        const feedbackBox = document.getElementById('feedback-box');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackText = document.getElementById('feedback-text');
        const nextBtn = document.getElementById('next-btn');
        const gameMain = document.querySelector('main');
        const resultsScreen = document.getElementById('results-screen');

        // --- Utilities ---
        function shuffleArray(array) {
            let newArr = [...array];
            for (let i = newArr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
            }
            return newArr;
        }

        // --- Core Logic ---
        function initGame() {
            // Shuffle questions and their internal options
            questions = shuffleArray(originalQuestions).map(q => {
                return {
                    ...q,
                    options: shuffleArray(q.options)
                };
            });
            
            qTotal.textContent = questions.length;
            currentQuestionIndex = 0;
            score = 0;
            currentStreak = 0;
            maxStreak = 0;
            correctAnswersCount = 0;
            
            updateScoreUI();
            
            gameMain.classList.remove('hidden');
            resultsScreen.classList.add('hidden');
            
            loadQuestion();
        }

        function loadQuestion() {
            const q = questions[currentQuestionIndex];
            
            // Update Progress
            qCurrent.textContent = currentQuestionIndex + 1;
            const progressPct = (currentQuestionIndex / questions.length) * 100;
            progressBar.style.width = `${progressPct}%`;
            
            // Render Text
            questionText.textContent = q.question;
            qBadge.textContent = q.badge;
            qSub.textContent = q.sub;
            
            // Render Options
            optionsGrid.innerHTML = '';
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = `option-btn w-full text-left bg-gray-50 border-2 border-gray-300 text-gray-800 font-bold p-4 rounded-2xl text-lg`;
                btn.innerHTML = `<span class="inline-block w-8 h-8 bg-gray-200 text-gray-600 rounded-full text-center leading-8 mr-3 border border-gray-300 shadow-sm">${String.fromCharCode(65 + index)}</span> ${opt.text}`;
                btn.onclick = () => selectOption(opt.correct, btn, q.options);
                optionsGrid.appendChild(btn);
            });
            
            // Reset UI States
            feedbackBox.classList.add('hidden');
            nextBtn.classList.add('hidden');
            document.getElementById('question-container').classList.remove('opacity-50');
        }

        function selectOption(isCorrect, selectedBtn, allOptionsData) {
            const buttons = optionsGrid.querySelectorAll('button');
            
            // Disable all buttons
            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                btn.classList.add('disabled-opt');
                
                // Highlight correct answer no matter what
                if (allOptionsData[idx].correct) {
                    btn.classList.remove('disabled-opt', 'bg-gray-50', 'border-gray-300', 'text-gray-800');
                    btn.classList.add('correct-ans');
                }
            });

            const q = questions[currentQuestionIndex];

            if (isCorrect) {
                // Correct Logic
                selectedBtn.classList.remove('disabled-opt'); // keep full opacity
                
                // Score Math (100 base + streak bonus)
                let pointsEarned = 100;
                currentStreak++;
                if (currentStreak > maxStreak) maxStreak = currentStreak;
                
                if (currentStreak >= 3) {
                    pointsEarned += 50; // Fire streak bonus
                }
                
                score += pointsEarned;
                correctAnswersCount++;
                updateScoreUI();

                // Feedback UI
                feedbackBox.className = "rounded-2xl p-5 mb-6 border-4 animate-pop shadow-sm bg-green-50 border-green-400";
                feedbackTitle.className = "text-2xl font-bold mb-2 flex items-center gap-2 text-green-700";
                feedbackTitle.innerHTML = `✅ Correct! <span class="text-sm font-bold bg-green-200 text-green-800 px-2 py-1 rounded-full">+${pointsEarned}</span>`;

            } else {
                // Wrong Logic
                selectedBtn.classList.remove('disabled-opt', 'bg-gray-50', 'border-gray-300', 'text-gray-800');
                selectedBtn.classList.add('wrong-ans');
                
                currentStreak = 0;
                updateScoreUI();

                // Feedback UI
                feedbackBox.className = "rounded-2xl p-5 mb-6 border-4 animate-pop shadow-sm bg-red-50 border-red-400";
                feedbackTitle.className = "text-2xl font-bold mb-2 flex items-center gap-2 text-red-700";
                feedbackTitle.innerHTML = `❌ Not Quite!`;
            }

            feedbackText.textContent = q.explanation;
            feedbackBox.classList.remove('hidden');
            nextBtn.classList.remove('hidden');
        }

        function updateScoreUI() {
            scoreDisplay.textContent = score;
            
            if (currentStreak >= 3) {
                streakContainer.classList.remove('hidden');
                streakCount.textContent = currentStreak;
            } else {
                streakContainer.classList.add('hidden');
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            gameMain.classList.add('hidden');
            resultsScreen.classList.remove('hidden');
            header = document.querySelector('header');
            header.classList.add('hidden');
            
            const maxPossible = questions.length * 150; // Rough max with streak bonuses
            const accuracy = Math.round((correctAnswersCount / questions.length) * 100);
            
            document.getElementById('final-score').textContent = score;
            document.getElementById('max-score').textContent = `~${maxPossible}`;
            document.getElementById('final-accuracy').textContent = `${accuracy}%`;
            document.getElementById('final-streak').textContent = maxStreak;
            
            const gradeMessage = document.getElementById('grade-message');
            const resultEmoji = document.getElementById('result-emoji');
            
            if (accuracy >= 90) {
                gradeMessage.textContent = "Extra Spicy Etymology Master! 🔥";
                gradeMessage.className = "text-2xl font-bold mb-8 text-red-600";
                resultEmoji.textContent = "🌶️👑";
            } else if (accuracy >= 70) {
                gradeMessage.textContent = "Great Job! You really know your roots.";
                gradeMessage.className = "text-2xl font-bold mb-8 text-orange-600";
                resultEmoji.textContent = "🌟";
            } else {
                gradeMessage.textContent = "Good practice! Keep studying those word parts.";
                gradeMessage.className = "text-2xl font-bold mb-8 text-blue-600";
                resultEmoji.textContent = "📚";
            }
        }

        function restartGame() {
            document.querySelector('header').classList.remove('hidden');
            initGame();
        }

        // Run on load
        window.onload = initGame;
    </script>
</body>
</html>
