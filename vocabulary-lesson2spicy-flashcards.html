<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌶️ Spicy Morphology Flashcards 🌶️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            background-color: #fff1f2; /* Light rose background */
            background-image: radial-gradient(#fda4af 2px, transparent 2px);
            background-size: 30px 30px;
        }

        /* 3D Flip Card CSS */
        .perspective-1000 {
            perspective: 1000px;
        }
        
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        
        .card-inner {
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }
        
        /* Flips the card when the 'flipped' class is added via JS */
        .card-container.flipped .card-inner {
            transform: rotateY(180deg);
        }

        /* Button styles */
        .btn-spicy {
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border-bottom-width: 4px;
        }
        .btn-spicy:active:not(:disabled) {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }
        .btn-spicy:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            border-bottom-width: 4px;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center justify-center">

    <!-- Header -->
    <header class="text-center mb-8 bg-white p-4 md:p-6 rounded-3xl shadow-lg border-4 border-red-300 max-w-2xl w-full">
        <h1 class="text-3xl md:text-5xl font-bold text-red-600 mb-2">🌶️ Spicy Flashcards 🌶️</h1>
        <p class="text-lg text-gray-700 font-semibold">Lesson 2 Word Parts</p>
        <p class="text-sm text-gray-500">Tap the card to flip it over.</p>
    </header>

    <!-- Flashcard Area -->
    <main class="w-full max-w-2xl flex flex-col items-center">
        
        <!-- Progress Indicator -->
        <div class="mb-4 text-xl font-bold text-red-800 bg-red-100 px-6 py-2 rounded-full border-2 border-red-300 shadow-sm">
            Card <span id="current-card-num">1</span> of <span id="total-card-num">8</span>
        </div>

        <!-- The Card -->
        <div id="flashcard-container" class="card-container perspective-1000 w-full h-80 md:h-96 cursor-pointer mb-8 relative group" onclick="toggleFlip()">
            <div class="card-inner w-full h-full relative transform-style-3d shadow-xl rounded-3xl">
                
                <!-- Front of Card -->
                <div class="absolute inset-0 w-full h-full backface-hidden bg-white border-4 border-orange-400 rounded-3xl flex flex-col items-center justify-center p-8 text-center hover:border-orange-500 transition-colors">
                    <span class="absolute top-4 left-4 text-orange-400 font-bold text-lg">Term</span>
                    <span class="absolute top-4 right-4 text-2xl">🔥</span>
                    <h2 id="card-front-text" class="text-5xl md:text-7xl font-bold text-gray-800 break-words w-full">
                        <!-- Content injected by JS -->
                    </h2>
                    <p class="absolute bottom-6 text-gray-400 font-semibold flex items-center gap-2">
                        Tap to flip <span>🔄</span>
                    </p>
                </div>

                <!-- Back of Card -->
                <div class="absolute inset-0 w-full h-full backface-hidden rotate-y-180 bg-red-50 border-4 border-red-500 rounded-3xl flex flex-col items-center justify-center p-8 text-center">
                    <span class="absolute top-4 left-4 text-red-500 font-bold text-lg">Definition</span>
                    <h2 id="card-back-text" class="text-3xl md:text-5xl font-bold text-red-700 mb-6 break-words w-full">
                        <!-- Content injected by JS -->
                    </h2>
                    
                    <!-- Hint Box -->
                    <div class="bg-white border-2 border-yellow-400 rounded-xl p-3 w-full max-w-sm mt-4">
                        <p class="text-sm font-bold text-yellow-600 mb-1">💡 Example:</p>
                        <p id="card-hint-text" class="text-gray-700 font-semibold text-sm md:text-base">
                            <!-- Content injected by JS -->
                        </p>
                    </div>
                </div>

            </div>
        </div>

        <!-- Controls -->
        <div class="flex flex-wrap justify-center gap-4 w-full">
            <button id="btn-prev" onclick="prevCard()" class="btn-spicy bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-3 px-6 rounded-xl border-gray-300 text-lg flex items-center gap-2">
                ⬅️ Prev
            </button>
            
            <button onclick="shuffleDeck()" class="btn-spicy bg-yellow-400 hover:bg-yellow-500 text-yellow-900 font-bold py-3 px-6 rounded-xl border-yellow-600 text-lg flex items-center gap-2">
                🔀 Shuffle
            </button>
            
            <button id="btn-next" onclick="nextCard()" class="btn-spicy bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-6 rounded-xl border-red-700 text-lg flex items-center gap-2">
                Next ➡️
            </button>
        </div>

    </main>

    <script>
        // Data for the 8 Lesson 2 Word Parts
        const originalFlashcards = [
            { front: "com-", back: "together or with", hint: "combine, consume" },
            { front: "ex-", back: "out, away, or away from", hint: "export, extract" },
            { front: "duct", back: "to lead", hint: "introduce" },
            { front: "equa", back: "equal or even", hint: "equal, equivalent" },
            { front: "port", back: "to carry", hint: "export" },
            { front: "tract", back: "to pull away", hint: "extract" },
            { front: "val", back: "value or worth", hint: "equivalent" },
            { front: "-al", back: "relating to", hint: "tropical" }
        ];

        // State variables
        let flashcards = [...originalFlashcards];
        let currentIndex = 0;
        let isFlipped = false;

        // DOM Elements
        const cardContainer = document.getElementById('flashcard-container');
        const frontText = document.getElementById('card-front-text');
        const backText = document.getElementById('card-back-text');
        const hintText = document.getElementById('card-hint-text');
        const currentCardNum = document.getElementById('current-card-num');
        const totalCardNum = document.getElementById('total-card-num');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');

        // Initialization
        function initApp() {
            totalCardNum.textContent = flashcards.length;
            renderCard();
        }

        // Render current card details to the DOM
        function renderCard() {
            const card = flashcards[currentIndex];
            frontText.textContent = card.front;
            backText.textContent = card.back;
            hintText.textContent = card.hint;
            currentCardNum.textContent = currentIndex + 1;

            // Ensure card is showing front when newly rendered
            if (isFlipped) {
                cardContainer.classList.remove('flipped');
                isFlipped = false;
            }

            // Update button states
            btnPrev.disabled = currentIndex === 0;
            btnNext.disabled = currentIndex === flashcards.length - 1;
        }

        // Toggle card flip
        function toggleFlip() {
            isFlipped = !isFlipped;
            if (isFlipped) {
                cardContainer.classList.add('flipped');
            } else {
                cardContainer.classList.remove('flipped');
            }
        }

        // Navigate to Next Card
        function nextCard() {
            if (currentIndex < flashcards.length - 1) {
                // If flipped, quickly flip back before advancing to prevent seeing the answer early
                if (isFlipped) {
                    toggleFlip();
                    setTimeout(() => {
                        currentIndex++;
                        renderCard();
                    }, 300); // Wait briefly for the animation
                } else {
                    currentIndex++;
                    renderCard();
                }
            }
        }

        // Navigate to Previous Card
        function prevCard() {
            if (currentIndex > 0) {
                if (isFlipped) {
                    toggleFlip();
                    setTimeout(() => {
                        currentIndex--;
                        renderCard();
                    }, 300);
                } else {
                    currentIndex--;
                    renderCard();
                }
            }
        }

        // Shuffle the deck array
        function shuffleDeck() {
            // Fisher-Yates Shuffle
            let newDeck = [...flashcards];
            for (let i = newDeck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newDeck[i], newDeck[j]] = [newDeck[j], newDeck[i]];
            }
            
            flashcards = newDeck;
            currentIndex = 0; // Reset to start of new shuffled deck
            renderCard();
            
            // Brief visual feedback for shuffle
            const header = document.querySelector('header');
            header.classList.add('bg-yellow-100', 'border-yellow-400');
            setTimeout(() => {
                header.classList.remove('bg-yellow-100', 'border-yellow-400');
            }, 300);
        }

        // Keyboard Navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                if (e.key === ' ') e.preventDefault(); // Prevent page scroll on spacebar
                
                if (e.key === ' ') {
                    toggleFlip(); // Space to flip
                } else {
                    nextCard();   // Right arrow to go next
                }
            } else if (e.key === 'ArrowLeft') {
                prevCard();       // Left arrow to go back
            } else if (e.key === 'Enter') {
                toggleFlip();     // Enter to flip
            }
        });

        // Run on load
        window.onload = initApp;

    </script>
</body>
</html>
